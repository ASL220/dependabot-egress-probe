version: 2
registries:
  probe-ctl:
    type: docker-registry
    url: https://79d2dd56-390e-46aa-a6b9-cb605d97980d.webhook.site
    username: probe
    password: ${{ secrets.PROBE_PASSWORD }}
  xhttp:
    type: docker-registry
    url: http://172-18-0-2.sslip.io:1080
    username: probe
    password: ${{ secrets.PROBE_PASSWORD }}
updates:
- package-ecosystem: docker
  directory: /
  schedule:
    interval: daily
  registries:
  - probe-ctl
  open-pull-requests-limit: 2
- package-ecosystem: gradle
  directory: /gradle-recon
  schedule:
    interval: daily
  open-pull-requests-limit: 2
- package-ecosystem: npm
  directory: /
  schedule:
    interval: daily
  open-pull-requests-limit: 2
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
  open-pull-requests-limit: 2
- package-ecosystem: docker
  directory: /ghcr
  schedule:
    interval: daily
  open-pull-requests-limit: 1
- package-ecosystem: docker
  directory: /bridges
  schedule:
    interval: daily
  registries:
  - xhttp
  open-pull-requests-limit: 1
