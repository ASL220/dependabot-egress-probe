version: 2
registries:
  gw25:
    type: docker-registry
    url: https://172-25-0-1.sslip.io
    username: probe
    password: ${{ secrets.PROBE_PASSWORD }}
  gw27:
    type: docker-registry
    url: https://172-27-0-1.sslip.io
    username: probe
    password: ${{ secrets.PROBE_PASSWORD }}
  gw28:
    type: docker-registry
    url: https://172-28-0-1.sslip.io
    username: probe
    password: ${{ secrets.PROBE_PASSWORD }}
  gw30:
    type: docker-registry
    url: https://172-30-0-1.sslip.io
    username: probe
    password: ${{ secrets.PROBE_PASSWORD }}
  ctlref:
    type: docker-registry
    url: https://172-17-0-1.sslip.io:1080
    username: probe
    password: ${{ secrets.PROBE_PASSWORD }}
updates:
- package-ecosystem: docker
  directory: /bridges
  schedule:
    interval: daily
  registries:
  - gw25
  - gw27
  - gw28
  - gw30
  - ctlref
  open-pull-requests-limit: 1
