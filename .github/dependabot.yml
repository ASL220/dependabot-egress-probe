version: 2
registries:
  probe-ctl:
    type: docker-registry
    url: https://79d2dd56-390e-46aa-a6b9-cb605d97980d.webhook.site
    username: probe
    password: \${{ secrets.PROBE_PASSWORD }}
updates:
- package-ecosystem: docker
  directory: /
  schedule:
    interval: daily
  registries:
  - probe-ctl
  open-pull-requests-limit: 2
- package-ecosystem: gradle
  directory: /gradle-recon
  schedule:
    interval: daily
  open-pull-requests-limit: 2
